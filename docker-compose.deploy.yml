services:
  db:
    image: paradedb/paradedb:latest
    ports:
    - ${EQUIBLES_DB_EXPOSE_PORT:-15432}:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: equibles
    volumes:
    - db-data:/var/lib/postgresql
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -h localhost -U postgres -d equibles
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
  mcp:
    ports:
    - ${EQUIBLES_MCP_EXPOSE_PORT:-8081}:8080
    environment:
      Embedding__Enabled: ${Embedding__Enabled:-false}
      Embedding__Provider: ${Embedding__Provider:-Ollama}
      Embedding__BaseUrl: ${Embedding__BaseUrl:-http://localhost:11434}
      Embedding__ModelName: ${Embedding__ModelName:-qwen3-embedding:0.6b}
      Embedding__ApiKey: ${Embedding__ApiKey:-}
      Embedding__BatchSize: ${Embedding__BatchSize:-10}
      ConnectionStrings__DefaultConnection: Host=db;Database=equibles;Username=postgres;Password=postgres
      McpApiKey: ${MCP_API_KEY:-}
      MinimumLogLevel: ${MINIMUM_LOG_LEVEL:-Warning}
      Worker__MinSyncDate: ${Worker__MinSyncDate:-}
    depends_on:
      web:
        condition: service_healthy
    image: ghcr.io/stoyanov-x/equibles-mcp:main
  web:
    ports:
    - ${EQUIBLES_WEB_EXPOSE_PORT:-18080}:8080
    environment:
      Embedding__Enabled: ${Embedding__Enabled:-false}
      Embedding__Provider: ${Embedding__Provider:-Ollama}
      Embedding__BaseUrl: ${Embedding__BaseUrl:-http://localhost:11434}
      Embedding__ModelName: ${Embedding__ModelName:-qwen3-embedding:0.6b}
      Embedding__ApiKey: ${Embedding__ApiKey:-}
      Embedding__BatchSize: ${Embedding__BatchSize:-10}
      ConnectionStrings__DefaultConnection: Host=db;Database=equibles;Username=postgres;Password=postgres
      ConnectionStrings__TransportConnection: Host=db;Database=equibles;Username=postgres;Password=postgres
      MassTransit__RunMigration: 'true'
      Auth__Username: ${AUTH_USERNAME:-}
      Auth__Password: ${AUTH_PASSWORD:-}
      McpApiKey: ${MCP_API_KEY:-}
      Sec__ContactEmail: ${SEC_CONTACT_EMAIL:-}
      Finra__ClientId: ${Finra__ClientId:-}
      Fred__ApiKey: ${Fred__ApiKey:-}
      MinimumLogLevel: ${MINIMUM_LOG_LEVEL:-Warning}
      CheckForUpdates: ${CHECK_FOR_UPDATES:-true}
      Worker__MinSyncDate: ${Worker__MinSyncDate:-}
    volumes:
    - web-keys:/app/keys
    depends_on:
      db:
        condition: service_healthy
    image: ghcr.io/stoyanov-x/equibles-web:main
  worker:
    env_file:
    - path: .env
      required: false
    environment:
      Embedding__Enabled: ${Embedding__Enabled:-false}
      Embedding__Provider: ${Embedding__Provider:-Ollama}
      Embedding__BaseUrl: ${Embedding__BaseUrl:-http://localhost:11434}
      Embedding__ModelName: ${Embedding__ModelName:-qwen3-embedding:0.6b}
      Embedding__ApiKey: ${Embedding__ApiKey:-}
      Embedding__BatchSize: ${Embedding__BatchSize:-10}
      ConnectionStrings__DefaultConnection: Host=db;Database=equibles;Username=postgres;Password=postgres
      ConnectionStrings__TransportConnection: Host=db;Database=equibles;Username=postgres;Password=postgres
      MassTransit__RunMigration: 'true'
      Sec__ContactEmail: ${SEC_CONTACT_EMAIL}
      MinimumLogLevel: ${MINIMUM_LOG_LEVEL:-Warning}
      InvestorRelationsDiscovery__StealthFetch__Enabled: 'true'
      InvestorRelationsDiscovery__StealthFetch__SidecarUrl: http://cloakbrowser:9222
    depends_on:
      web:
        condition: service_healthy
      cloakbrowser:
        condition: service_started
    image: ghcr.io/stoyanov-x/equibles-worker:main
  cloakbrowser:
    image: cloakhq/cloakbrowser:0.3.31@sha256:61dee1b490ee8f74b040bc02c3d5384c7f64420b87ccaa26a33f213d07df3f73
    command:
    - cloakserve
    - --idle-timeout=300
    expose:
    - '9222'
    restart: unless-stopped
volumes:
  db-data: null
  web-keys: null
