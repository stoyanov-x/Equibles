# MERIDIAN self-contained deploy compose.
#
# Coolify runs exactly ONE compose file, so this is the merged, standalone
# equivalent of upstream's layered files:
#   docker-compose.yml          (db/web/mcp/worker)
# + docker-compose.embedding.yml (embeddings ON + Ollama)
# + docker-compose.stealth.yml   (CloakBrowser for bot-challenged IR sites)
#
# The only Meridian divergence from upstream is the db host port, made
# env-settable via EQUIBLES_DB_EXPOSE_PORT (default 5432) so it can't collide
# with the host's existing Postgres on 127.0.0.1:5432. web/mcp/worker reach db
# over the internal network as db:5432, so nothing else changes.
#
# Keep all ${VAR:-...} placeholders: Coolify injects these at runtime.

x-embedding-environment: &embedding-environment
  Embedding__Enabled: "true"
  Embedding__Provider: "Ollama"
  Embedding__BaseUrl: "http://embedding:11434"
  Embedding__ModelName: "qwen3-embedding:0.6b"
  Embedding__ApiKey: ""
  Embedding__BatchSize: "10"

services:
  db:
    image: paradedb/paradedb:latest
    ports:
      - "${EQUIBLES_DB_EXPOSE_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: equibles
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      # -h localhost forces a TCP probe. Without it, pg_isready hits the Unix
      # socket and reports healthy during ParadeDB's init phase — before the
      # init script shuts Postgres down and restarts it on TCP. Apps connect
      # over TCP, so this matches reality.
      test: ["CMD-SHELL", "pg_isready -h localhost -U postgres -d equibles"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  mcp:
    build:
      context: .
      dockerfile: src/Equibles.Mcp.Server/Dockerfile
    ports:
      - "8081:8080"
    environment:
      <<: *embedding-environment
      ConnectionStrings__DefaultConnection: "Host=db;Database=equibles;Username=postgres;Password=postgres"
      McpApiKey: ${MCP_API_KEY:-}
      MinimumLogLevel: ${MINIMUM_LOG_LEVEL:-Warning}
      Worker__MinSyncDate: ${Worker__MinSyncDate:-}
    depends_on:
      web:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: src/Equibles.Web/Dockerfile
    ports:
      - "8080:8080"
    environment:
      <<: *embedding-environment
      ConnectionStrings__DefaultConnection: "Host=db;Database=equibles;Username=postgres;Password=postgres"
      ConnectionStrings__TransportConnection: "Host=db;Database=equibles;Username=postgres;Password=postgres"
      # Web boots before worker (worker depends on web). Without this flag the
      # bus has no schema to connect to, fails its health check, and /healthz
      # never goes ready — leaving worker stuck on `web: service_healthy`.
      # Schema creation is idempotent, so it's safe that worker may also run it.
      MassTransit__RunMigration: "true"
      Auth__Username: ${AUTH_USERNAME:-}
      Auth__Password: ${AUTH_PASSWORD:-}
      McpApiKey: ${MCP_API_KEY:-}
      Sec__ContactEmail: ${SEC_CONTACT_EMAIL:-}
      Finra__ClientId: ${Finra__ClientId:-}
      Fred__ApiKey: ${Fred__ApiKey:-}
      MinimumLogLevel: ${MINIMUM_LOG_LEVEL:-Warning}
      CheckForUpdates: ${CHECK_FOR_UPDATES:-true}
      # Same backfill floor the worker uses — historical charts/tables clamp to it.
      Worker__MinSyncDate: ${Worker__MinSyncDate:-}
    volumes:
      - web-keys:/app/keys
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: src/Equibles.Worker.Host/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      <<: *embedding-environment
      ConnectionStrings__DefaultConnection: "Host=db;Database=equibles;Username=postgres;Password=postgres"
      ConnectionStrings__TransportConnection: "Host=db;Database=equibles;Username=postgres;Password=postgres"
      MassTransit__RunMigration: "true"
      Sec__ContactEmail: ${SEC_CONTACT_EMAIL}
      MinimumLogLevel: ${MINIMUM_LOG_LEVEL:-Warning}
      # CloakBrowser sidecar (stealth) for bot-challenged investor-relations sites.
      InvestorRelationsDiscovery__StealthFetch__Enabled: "true"
      InvestorRelationsDiscovery__StealthFetch__SidecarUrl: "http://cloakbrowser:9222"
    depends_on:
      web:
        condition: service_healthy
      embedding-pull:
        condition: service_completed_successfully
      cloakbrowser:
        condition: service_started

  # Ollama embeddings backend.
  embedding:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: pull the embedding model before worker starts.
  embedding-pull:
    image: ollama/ollama:latest
    depends_on:
      embedding:
        condition: service_healthy
    restart: "no"
    entrypoint: ["ollama", "pull", "qwen3-embedding:0.6b"]
    environment:
      OLLAMA_HOST: http://embedding:11434

  # Third-party stealth Chromium (CloakBrowser) for IR sites with bot challenges.
  # CDP endpoint stays internal; this container receives no secrets or volumes.
  cloakbrowser:
    image: cloakhq/cloakbrowser:0.3.31@sha256:61dee1b490ee8f74b040bc02c3d5384c7f64420b87ccaa26a33f213d07df3f73
    command: ["cloakserve", "--idle-timeout=300"]
    expose:
      - "9222"
    restart: unless-stopped

volumes:
  db-data:
  web-keys:
  ollama-data:
