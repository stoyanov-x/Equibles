name: Hydrate deploy compose

# Regenerates docker-compose.deploy.yml from the upstream layered files
# (docker-compose.yml + .embedding.yml + .stealth.yml) so the fork keeps
# docker-compose.yml pristine and the single deploy file stays in sync.
# Runs daily (after the weekly upstream sync) and on demand.

on:
  schedule:
    - cron: "25 3 * * 1"   # weekly Mon 03:25 UTC (right after upstream sync at Mon 03:17)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: hydrate-deploy
  cancel-in-progress: false

jobs:
  hydrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install pyyaml

      - name: Hydrate docker-compose.deploy.yml
        env:
          # Repo vars -> hydrate flags. GHCR=image refs; EMBEDDINGS/CLOAK toggle overlays.
          EQUIBLES_USE_GHCR: ${{ vars.EQUIBLES_USE_GHCR }}
          EQUIBLES_EMBEDDINGS: ${{ vars.EQUIBLES_EMBEDDINGS }}
          EQUIBLES_CLOAK: ${{ vars.EQUIBLES_CLOAK }}
        run: python scripts/hydrate_deploy.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docker-compose.deploy.yml
          if git diff --cached --quiet; then
            echo "No changes to docker-compose.deploy.yml"
          else
            git commit -m "chore(deploy): hydrate docker-compose.deploy.yml"
            git push origin main
          fi
