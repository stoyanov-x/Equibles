name: Build & push GHCR images

# Builds the three source-built services (web/mcp/worker) once on a GitHub
# runner and pushes them to ghcr.io/stoyanov-x, so Coolify only pulls prebuilt
# images instead of compiling on the small-disk server. hydrate_deploy.py
# rewrites the compose to reference these images when EQUIBLES_USE_GHCR=1.
#
# Public packages (public fork) -> free storage, no download charge.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "**/Dockerfile"
      - "Directory.*"
      - "*.sln"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: build-push
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: web
            dockerfile: src/Equibles.Web/Dockerfile
            image: ghcr.io/stoyanov-x/equibles-web
          - service: mcp
            dockerfile: src/Equibles.Mcp.Server/Dockerfile
            image: ghcr.io/stoyanov-x/equibles-mcp
          - service: worker
            dockerfile: src/Equibles.Worker.Host/Dockerfile
            image: ghcr.io/stoyanov-x/equibles-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ matrix.image }}:main
            ${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=equibles-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=equibles-${{ matrix.service }}
