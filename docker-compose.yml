x-embedding-environment: &embedding-environment
  Embedding__Enabled: ${Embedding__Enabled:-false}
  Embedding__Provider: ${Embedding__Provider:-Ollama}
  Embedding__BaseUrl: ${Embedding__BaseUrl:-http://localhost:11434}
  Embedding__ModelName: ${Embedding__ModelName:-qwen3-embedding:0.6b}
  Embedding__ApiKey: ${Embedding__ApiKey:-}
  Embedding__BatchSize: ${Embedding__BatchSize:-10}

services:
  db:
    image: paradedb/paradedb:latest
    # Throttle the database so it cannot starve the other ~19 containers on the
    # 2-core prod box (measured at 50% of the machine with no cgroup limit at
    # all). A cap does NOT create capacity -- it only decides who loses the race,
    # so memory stays generous (shared_buffers alone is ~954 MB) and only CPU is
    # squeezed.
    cpus: "0.5"
    mem_limit: 1536m
    # ParadeDB ships max_parallel_workers=10. On 2 cores that lets many concurrent
    # sessions each claim a parallel worker and saturate the CPU. Cap the global
    # pool (max_parallel_workers_per_gather is already 1) and maintenance too.
    # shared_preload_libraries (pg_search,pg_cron,pg_stat_statements) comes from
    # the image's config files, not from this command, so it is unaffected.
    command:
      - postgres
      - -c
      - max_parallel_workers=2
      - -c
      - max_parallel_maintenance_workers=1
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: equibles
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      # -h localhost forces a TCP probe. Without it, pg_isready hits the Unix
      # socket and reports healthy during ParadeDB's init phase — before the
      # init script shuts Postgres down and restarts it on TCP. Apps connect
      # over TCP, so this matches reality.
      test: ["CMD-SHELL", "pg_isready -h localhost -U postgres -d equibles"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  mcp:
    build:
      context: .
      dockerfile: src/Equibles.Mcp.Server/Dockerfile
    ports:
      - "8081:8080"
    environment:
      <<: *embedding-environment
      ConnectionStrings__DefaultConnection: "Host=db;Database=equibles;Username=postgres;Password=postgres"
      McpApiKey: ${MCP_API_KEY:-}
      MinimumLogLevel: ${MINIMUM_LOG_LEVEL:-Warning}
      Worker__MinSyncDate: ${Worker__MinSyncDate:-}
    depends_on:
      web:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: src/Equibles.Web/Dockerfile
    ports:
      - "8080:8080"
    environment:
      <<: *embedding-environment
      ConnectionStrings__DefaultConnection: "Host=db;Database=equibles;Username=postgres;Password=postgres"
      ConnectionStrings__TransportConnection: "Host=db;Database=equibles;Username=postgres;Password=postgres"
      # Web boots before worker (worker depends on web). Without this flag the
      # bus has no schema to connect to, fails its health check, and /healthz
      # never goes ready — leaving worker stuck on `web: service_healthy`.
      # Schema creation is idempotent, so it's safe that worker may also run it.
      MassTransit__RunMigration: "true"
      Auth__Username: ${AUTH_USERNAME:-}
      Auth__Password: ${AUTH_PASSWORD:-}
      McpApiKey: ${MCP_API_KEY:-}
      Sec__ContactEmail: ${SEC_CONTACT_EMAIL:-}
      Finra__ClientId: ${Finra__ClientId:-}
      Fred__ApiKey: ${Fred__ApiKey:-}
      MinimumLogLevel: ${MINIMUM_LOG_LEVEL:-Warning}
      CheckForUpdates: ${CHECK_FOR_UPDATES:-true}
      # Same backfill floor the worker uses — historical charts/tables clamp to it.
      Worker__MinSyncDate: ${Worker__MinSyncDate:-}
    volumes:
      - web-keys:/app/keys
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: src/Equibles.Worker.Host/Dockerfile
    # Background consumer, not latency-sensitive -- the cheapest place to reclaim
    # CPU. It measured ~57% of the entire 2-core box (the single largest
    # consumer) once the low-disk guard stopped holding it paused, so it is capped
    # harder than the database. mem_limit stays above its observed ~678 MB so this
    # cannot turn into an OOM-kill loop.
    cpus: "0.5"
    mem_limit: 1024m
    env_file:
      - path: .env
        required: false
    environment:
      <<: *embedding-environment
      ConnectionStrings__DefaultConnection: "Host=db;Database=equibles;Username=postgres;Password=postgres"
      ConnectionStrings__TransportConnection: "Host=db;Database=equibles;Username=postgres;Password=postgres"
      MassTransit__RunMigration: "true"
      Sec__ContactEmail: ${SEC_CONTACT_EMAIL}
      EquityMarkets__LisbonEnabled: ${EQUITY_MARKETS_LISBON_ENABLED:-false}
      MinimumLogLevel: ${MINIMUM_LOG_LEVEL:-Warning}
    depends_on:
      web:
        condition: service_healthy

volumes:
  db-data:
  web-keys:
